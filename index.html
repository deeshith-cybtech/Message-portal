<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6fb">
  <title>Message Portal</title>

  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: #182230;
      background: #f3f6fb;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        radial-gradient(ellipse at 12% 8%, #e4ecff 0, transparent 32%),
        #f3f6fb;
    }

    .page {
      width: min(100%, 460px);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      margin-bottom: 22px;
      color: #24344d;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 11px;
      background: #243f78;
      color: white;
      font-size: 17px;
      font-weight: 800;
    }

    .card {
      padding: 38px;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 18px 55px rgba(31, 48, 77, 0.10);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #526b99;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #182230;
      font-size: 30px;
      letter-spacing: -0.04em;
    }

    .intro {
      margin: 12px 0 28px;
      color: #667386;
      font-size: 15px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: #263449;
      font-size: 14px;
      font-weight: 700;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 180px;
      padding: 14px 15px;
      border: 1px solid #cbd4e1;
      border-radius: 9px;
      background: #fff;
      color: #182230;
      font: inherit;
      font-size: 15px;
      line-height: 1.55;
      resize: vertical;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    textarea::placeholder {
      color: #9aa5b5;
    }

    textarea:focus {
      border-color: #4266a8;
      outline: none;
      box-shadow: 0 0 0 4px rgba(66, 102, 168, 0.14);
    }

    .note {
      margin: 10px 0 22px;
      color: #788496;
      font-size: 12px;
      line-height: 1.5;
    }

    button {
      display: flex;
      width: 100%;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 0;
      border-radius: 9px;
      background: #294a83;
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 140ms ease, transform 140ms ease;
    }

    button:hover {
      background: #203d70;
      transform: translateY(-1px);
    }

    button:focus-visible {
      outline: 3px solid #91aee5;
      outline-offset: 3px;
    }

    .footer {
      margin: 18px 0 0;
      color: #8792a2;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 520px) {
      .card {
        padding: 28px 22px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">M</span>
      <span>Message Portal</span>
    </div>

    <section class="card" aria-labelledby="page-title">
      <p class="eyebrow">Private message form</p>
      <h1 id="page-title">Send a message</h1>
      <p class="intro">
        Write your message below. It will be delivered to the site owner.
      </p>

      <form
        action="https://script.google.com/macros/s/AKfycbytfscFPHc4ikkywavPiEr9Ue3usQN4FUclKdBTqtG1o6vw-V2Y_w8o7QdKnzcn7pJN/exec"
        method="post"
      >
        <label for="message">Your message</label>
        <textarea
          id="message"
          name="message"
          maxlength="10000"
          placeholder="Type your message here..."
          required
        ></textarea>

        <p class="note">
          Please don’t include passwords or other sensitive information.
        </p>

        <button type="submit">
          Send message
          <span aria-hidden="true">→</span>
        </button>
      </form>
    </section>

    <p class="footer">
      Message Portal · A simple way to send a note
    </p>
  </main>
</body>
</html>
